<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Cast into a living river in Riverlight: Fishing RPG, a cozy story-led fishing adventure for Android by F7 Developer.">
  <title>Riverlight: Fishing RPG | F7 Developer</title>
  <style>
    :root{color-scheme:dark;font-family:Georgia,serif;background:#0f1714;color:#e9e3d2}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:2rem;box-sizing:border-box}
    main{width:min(100%,680px);border:1px solid #4c6b58;padding:clamp(1.5rem,6vw,4rem);box-sizing:border-box;background:#141f1a}
    .eyebrow{font:700 .75rem/1.4 system-ui,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:#a9c49a}
    h1{font-size:clamp(2.7rem,10vw,5rem);font-weight:400;line-height:1;margin:.65em 0 .3em}
    p{font:1.1rem/1.7 system-ui,sans-serif;color:#cdd6c8;max-width:55ch}
    .links{display:flex;flex-wrap:wrap;gap:.8rem;margin:2rem 0}
    .button{display:inline-block;padding:.85rem 1.15rem;border:1px solid #c8d79f;color:#131a13;background:#c8d79f;text-decoration:none;font:700 .9rem system-ui,sans-serif}
    .button.secondary{background:transparent;color:#e9e3d2}
    .badge{display:inline-block;margin-top:1rem}.badge img{width:250px;height:54px;max-width:100%;object-fit:contain}
    .footer{margin-top:2.5rem;font:.85rem system-ui,sans-serif}.footer a{color:#a9c49a}
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">F7 Developer · Cozy Fishing RPG</div>
    <h1>Riverlight</h1>
    <p>One old journal. Five living legends. Fish four waters from sunrise to starlight, follow Grandpa Theo's unfinished story, and turn a riverside cabin into your own quiet haven.</p>
    <div class="links">
      <a class="button" href="https://play.google.com/store/apps/details?id=com.cozyfishing.riverlight">Get it on Google Play</a>
      <a class="button secondary" href="https://pixelpicked.com/game/6kBSirSuGL9/riverlight-fishing-rpg">Explore on PixelPicked</a>
    </div>
    <a class="badge" href="https://pixelpicked.com/game/6kBSirSuGL9/riverlight-fishing-rpg" target="_blank" rel="noopener"><img src="https://api.pixelpicked.com/api/badges/6kBSirSuGL9/live.png?theme=dark" width="250" height="54" alt="Approved on PixelPicked"></a>
    <div class="footer"><a href="/">F7 Developer</a></div>
  </main>
</body>
</html>
